*{box-sizing:border-box;min-width:0}

.sub{color:var(--mut);margin:0 0 18px}

  for (const [re, art, txt] of RULES) if (re.test(x.w) && arts(x).includes(art)) return txt;
  if (x.n === 'Pl') return 'Bu isim sadece çoğul kullanılıyor; çoğulda artikel her zaman <b class="pl-t">die</b>.';
  const parts = D.filter(y => y !== x && y.w.length >= 3 && x.w.length > y.w.length + 2 && x.w.toLowerCase().endsWith(y.w.toLowerCase()) && y.a === x.a);
  if (parts.length) { const y = parts.sort((p, q) => q.w.length - p.w.length)[0]; return `Birleşik isim: artikel'i son parça belirliyor → <b class="${cls(arts(y)[0])}">${y.a}</b> ${esc(y.w)}.`; }
  return '';
}

// ---------- filters ----------
function renderFilters(){
  const c = `<button class="chip" id="fAll" aria-pressed="${st.chaps.length === 6 && st.meta && st.ek && !st.star}">Tümü</button>` + [1,2,3,4,5,0].map(k => `<button class="chip" data-k="${k}" aria-pressed="${st.chaps.length < 6 && st.chaps.includes(k)}">${k ? 'K' + k : 'Plattform'}</button>`).join('');
  $('filters').innerHTML = c + `<button class="chip" id="fStar" aria-pressed="${st.star}"><span class="star">★</span> sadece önemli</button><button class="chip" id="fMeta" aria-pressed="${st.meta}">Talimat kelimeleri</button><button class="chip" id="fEk" aria-pressed="${st.ek}">Listede olmayanlar</button><button class="chip" id="fTr" aria-pressed="${st.hideTr}">Türkçeyi gizle</button><span class="count">${pool().length} kelime</span>`;
}
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'fAll') { st.chaps = [0,1,2,3,4,5]; st.meta = true; st.ek = true; st.star = false; }
  else if (b.dataset.k !== undefined) {
    const k = +b.dataset.k;
    // all selected → tapping one chapter selects only that chapter; otherwise toggle; nothing left → all
    if (st.chaps.length === 6) st.chaps = [k];
    else st.chaps = st.chaps.includes(k) ? st.chaps.filter(x => x !== k) : [...st.chaps, k].sort();
    if (!st.chaps.length) st.chaps = [0,1,2,3,4,5];
  }
  else if (b.id === 'fStar') st.star = !st.star;
  else if (b.id === 'fMeta') st.meta = !st.meta;
  else if (b.id === 'fEk') st.ek = !st.ek;
  else if (b.id === 'fTr') { st.hideTr = !st.hideTr; saveF(); renderFilters(); if (cur && !answered) drawCard(); return; }
  saveF(); renderFilters(); start(); renderList();
});

// ---------- practice ----------
let lastFb = null, lastPrev = null, lastOk = false, added = false;
let deck = [], cur = null, answered = false, right = 0, wrong = 0, total = 0, roundMiss = [], done = 0, src = 'all';
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start(list, from){
  src = from || 'all';
  deck = shuffle((list || pool()).slice()); total = deck.length; right = wrong = done = 0; roundMiss = []; next();
}
function next(){ answered = false; added = false; cur = deck.shift(); if (!cur) return finish(); drawCard(); }
function drawCard(fb){
  const plOnly = cur.n === 'Pl';
  const head = answered ? arts(cur).map(a => `<span class="${cls(a)}">${a}</span>`).join('/') + ' ' : '';
  const inList = W[key(cur)];
  const meta = `${kname(cur.k)}${cur.g === 'm' ? ' · talimat kelimesi' : ''}${cur.g === 'e' ? ' · listede yok, kitapta/derste geçiyor' : ''}${cur.b ? ' · <span class="star">★</span> önemli' : ''}${plOnly ? ' · <span class="pl-t">sadece çoğul</span>' : ''}${inList ? ` · <span class="die-t">Yanlışlarım'da (${inList.c}/${NEED})</span>` : ''}`;
  const srcLabel = src === 'wrong' ? 'Yanlışlarım çalışılıyor' : src === 'round' ? 'Bu turun yanlışları çalışılıyor' : 'Seçili kelimeler çalışılıyor';
  $('prac').innerHTML = `
  <p class="meta" style="text-align:left">${srcLabel}</p>
  <div class="card ${fb ? fb.c : ''}">
    <p class="meta">${meta}</p>
    <p class="word">${head}${esc(cur.w)}</p>
    <p class="tr ${st.hideTr && !answered ? 'hid' : ''}" id="tr" title="Göstermek için dokun">${esc(cur.t)}</p>
    <div class="fb" aria-live="polite">${fb ? fb.h : ''}</div>
  </div>
  <div class="btns">${['der','das','die'].map((a,i) => `<button class="ab ${a}" data-a="${a}" ${answered ? 'disabled' : ''}>${a}<small>${['maskulin','neutrum','feminin'][i]} · ${i+1}</small></button>`).join('')}</div>
  <div class="row">${answered ? '<button class="next" id="nx">Sonraki →</button>' : ''}${answered && lastOk && !added ? '<button class="ghost" id="add">Tahminle bildim, Yanlışlarım\'a ekle</button>' : ''}${answered && added ? '<span class="das-t" style="font-weight:800">Yanlışlarım\'a eklendi</span>' : ''}${!answered ? '<button class="ghost" id="idk">Bilmiyorum</button>' : ''}<button class="ghost" id="end">Turu bitir</button></div>
  <div class="bar"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
  <div class="stats"><span>✓ ${right} doğru · ✗ ${wrong} yanlış</span><span>${deck.length + 1} kart kaldı</span></div>`;
  if (answered) $('nx').focus();
}
function answer(a){
  if (answered || !cur) return;
  answered = true;
  const ok = arts(cur).includes(a);
  const k = key(cur);
  lastPrev = W[k] ? Object.assign({}, W[k]) : null; lastOk = ok;
  let saved = '';
  if (ok) {
    right++; done++;
    if (W[k]) { W[k].c++; if (W[k].c >= NEED) { delete W[k]; saved = `<br><span class="das-t">Arka arkaya ${NEED} kez doğru: Yanlışlarım listesinden çıktı.</span>`; } else saved = `<br><span style="color:var(--mut)">Yanlışlarım: ${W[k].c}/${NEED} doğru.</span>`; saveW(); }
  } else {
    wrong++; if (!roundMiss.includes(cur)) roundMiss.push(cur);
    W[k] = {m: (W[k] ? W[k].m : 0) + 1, c: 0, g: W[k] ? (W[k].g || 0) : 0}; saveW();
    deck.splice(Math.min(deck.length, 4 + Math.floor(Math.random() * 3)), 0, cur);
    saved = `<br><span style="color:var(--mut)">Yanlışlarım listesine kaydedildi; bu turda birkaç kart sonra tekrar gelecek.</span>`;
  }
  let info;
  if (cur.n === 'Pl') info = `Bu isim sadece çoğul kullanılıyor.`;
  else if (cur.p) info = `Plural: <b class="pl-t">die ${esc(cur.p)}</b>`;
  else info = `Çoğulu yok (sadece tekil).`;
  if (arts(cur).length > 1) info += ` İki artikel de doğru kabul ediliyor.`;
  const h = (ok ? `<b class="das-t">Doğru.</b> ${info}` : `<b class="die-t">${a === '?' ? 'Cevap' : 'Doğrusu'}: ${cur.a} ${esc(cur.w)}</b> · ${info}`) + saved;
  const hint = !ok ? hintFor(cur) : '';
  lastFb = {c: ok ? 'ok' : 'no', h: h + (hint ? `<div class="hint">İpucu: ${hint}</div>` : '')};
  drawCard(lastFb);
  updateWrongTab();
}
function addGuess(){
  if (!cur || !answered || !lastOk || added) return;
  const k = key(cur);
  W[k] = {m: lastPrev ? lastPrev.m : 0, c: 0, g: (lastPrev && lastPrev.g || 0) + 1}; saveW();
  added = true;
  if (!roundMiss.includes(cur)) roundMiss.push(cur);
  deck.splice(Math.min(deck.length, 4 + Math.floor(Math.random() * 3)), 0, cur);
  lastFb.h = lastFb.h.replace(/<br><span[^>]*>(Yanlışlarım:|Arka arkaya)[^<]*<\/span>/, '') + `<br><span style="color:var(--mut)">Yanlışlarım listesine eklendi; bu turda birkaç kart sonra tekrar gelecek.</span>`;
  drawCard(lastFb); updateWrongTab();
}
function finish(){
  const tried = right + wrong;
  const pct = tried ? Math.round(right / tried * 100) : 0;
  const rows = roundMiss.map(x => `<tr><td><b class="${cls(arts(x)[0])}">${x.a}</b> ${esc(x.w)}</td><td>${x.p ? 'die ' + esc(x.p) : '—'}</td><td>${esc(x.t)}</td></tr>`).join('');
  $('prac').innerHTML = `<div class="card done" style="text-align:left"><h2>Tur bitti</h2>
  <p>${tried} cevap · ilk denemede doğru oranı <b>${pct}%</b></p>
  ${roundMiss.length ? `<p>Bu turda yanlış yapılan ya da listeye eklenen ${roundMiss.length} kelime (hepsi Yanlışlarım listesinde de duruyor):</p>
  <table class="wt"><tr><th>Doğrusu</th><th>Plural</th><th>Türkçe</th></tr>${rows}</table>
  <div class="row"><button class="next" id="rr">Bu yanlışları çalış</button><button class="ghost" id="gw">Yanlışlarım listesine git</button><button class="ghost" id="rs">Yeni tur</button></div>`
  : `<p>Bu turda yanlış yok.</p><div class="row"><button class="next" id="rs">Yeni tur</button></div>`}</div>`;
}
$('prac').addEventListener('click', e => {
  if (e.target.id === 'tr') { e.target.classList.remove('hid'); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.a) answer(b.dataset.a);
  else if (b.id === 'idk') answer('?');
  else if (b.id === 'add') addGuess();
  else if (b.id === 'nx') next();
  else if (b.id === 'end') { deck = []; cur = null; finish(); }
  else if (b.id === 'rs') start();
  else if (b.id === 'rr') start(roundMiss.slice(), 'round');
  else if (b.id === 'gw') tab('w');
});
document.addEventListener('keydown', e => {
  if ($('prac').hidden || e.target.tagName === 'INPUT') return;
  if (['1','2','3'].includes(e.key)) answer(['der','das','die'][+e.key - 1]);
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});

// ---------- mistakes list ----------
let confirmClear = false;
function updateWrongTab(){ $('tWrong').textContent = `Yanlışlarım (${wrongList().length})`; }
function renderWrong(){
  const xs = wrongList().sort((p, q) => (W[key(q)].m + (W[key(q)].g||0)) - (W[key(p)].m + (W[key(p)].g||0)) || p.w.localeCompare(q.w, 'de'));
  updateWrongTab();
  if (!xs.length) { $('wrong').innerHTML = `<p class="empty">Liste boş. Alıştırmada yanlış yapılan ya da „Bilmiyorum“ / „Tahminle bildim“ ile eklenen kelimeler burada birikiyor ve arka arkaya ${NEED} kez doğru bilinince buradan çıkıyor.</p>`; return; }
  const rows = xs.map(x => { const w = W[key(x)]; return `<tr><td><b class="${cls(arts(x)[0])}">${x.a}</b> ${esc(x.w)}</td><td>${x.p ? 'die ' + esc(x.p) : '—'}</td><td>${esc(x.t)}</td><td class="n">${w.m ? w.m + '× yanlış' : ''}${w.m && w.g ? '<br>' : ''}${w.g ? w.g + '× tahmin' : ''}<br>${w.c}/${NEED}</td></tr>`; }).join('');
  $('wrong').innerHTML = `<p class="sub" style="margin-bottom:10px">${xs.length} kelime. En çok zorlanılanlar üstte. Sağdaki sayı, kelimenin listeden çıkması için gereken arka arkaya doğru sayısını gösteriyor.</p>
  <div class="row" style="margin:0 0 6px"><button class="next" id="sw">Bu listeyi çalış</button>
  ${confirmClear ? `<span class="confirm">Liste tamamen silinsin mi? <button class="ghost" id="cy">Evet, sil</button><button class="ghost" id="cn">Vazgeç</button></span>` : `<button class="ghost" id="cl">Listeyi temizle</button>`}</div>
  <table class="wt"><tr><th>Doğrusu</th><th>Plural</th><th>Türkçe</th><th style="text-align:right">Durum</th></tr>${rows}</table>`;
}
$('wrong').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'sw') { tab('p'); start(wrongList(), 'wrong'); }
  else if (b.id === 'cl') { confirmClear = true; renderWrong(); }
  else if (b.id === 'cn') { confirmClear = false; renderWrong(); }
  else if (b.id === 'cy') { W = {}; saveW(); confirmClear = false; renderWrong(); }
});

// ---------- full list ----------
function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const items = pool().filter(x => !q || x.w.toLowerCase().includes(q) || x.t.toLowerCase().includes(q));
  $('cols').innerHTML = ['der','das','die'].map(a => {
    const xs = items.filter(x => arts(x)[0] === a).sort((p, r) => p.w.localeCompare(r.w, 'de'));
    return `<div class="col"><h3 class="${cls(a)}">${a} <span style="font-size:16px;color:var(--mut)">${xs.length}</span></h3><ul>${xs.map(x => `<li><b>${esc(x.w)}</b>${x.b ? ' <span class="star" style="display:inline">★</span>' : ''}${x.n === 'Pl' ? ' <i class="pl-t">(Pl.)</i>' : ''}${arts(x).length > 1 ? ` <i>(${x.a})</i>` : ''}${W[key(x)] ? ' <i class="die-t">(yanlışlarımda)</i>' : ''}<span>${esc(x.t)}${x.p ? ' · Pl. ' + esc(x.p) : ''}</span></li>`).join('') || '<li style="color:var(--mut)">—</li>'}</ul></div>`;
  }).join('');
}
$('q').addEventListener('input', renderList);

function tab(which){
  const map = {p: ['tPrac', 'prac'], w: ['tWrong', 'wrong'], l: ['tList', 'list']};
  for (const [k, [t, s]] of Object.entries(map)) { $(t).setAttribute('aria-selected', k === which); $(s).hidden = k !== which; }
  $('set').hidden = which === 'w';
  if (which === 'w') renderWrong();
  if (which === 'l') renderList();
}
$('tPrac').addEventListener('click', () => tab('p'));
$('tWrong').addEventListener('click', () => tab('w'));
$('tList').addEventListener('click', () => tab('l'));

if (window.innerWidth > 600) $('set').open = true;
renderFilters(); updateWrongTab(); start(); renderList();
}
</script>
